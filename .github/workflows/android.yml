name: Build and publish Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kelrodis.jks"
      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/kelrodis.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: kelrodis
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" kelrodis.apk
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 --title "Kelrodis 1.0.0" --notes "Android programėlė. Atsisiųskite kelrodis.apk ir atidarykite jį savo telefone. iPhone naudotojai gali naudoti https://kelrodis-lietuva.kaikajusk.chatgpt.site"
          gh release upload v1.0.0 kelrodis.apk --clobber
