name: Web navigation checks
on:
  push:
    branches: [main]
    paths: ['web/**', 'tests/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/web-tests.yml']
  pull_request:
    paths: ['web/**', 'tests/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/web-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
